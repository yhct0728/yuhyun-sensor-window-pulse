<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>Pulse v2 — 노드 모니터 (현장-블라인드)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: {
        sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Apple SD Gothic Neo', 'Malgun Gothic', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'SF Mono', 'ui-monospace', 'Menlo', 'monospace'],
      } } },
    };
  </script>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    :root {
      --rx-live: #10b981;
      --rx-live-text: #047857;
      --rx-live-bg: rgba(16,185,129,0.10);
      --rx-live-ring: rgba(16,185,129,0.32);
      --rx-ping: 1;
    }
    body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      font-feature-settings: 'cv11', 'ss01', 'tnum';
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.005em;
    }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* accent-driven status (pill + metric icon) */
    .rx-live-pill { background: var(--rx-live-bg); color: var(--rx-live-text); --tw-ring-color: var(--rx-live-ring); }
    .rx-live-icon { background: var(--rx-live-bg); color: var(--rx-live-text); --tw-ring-color: var(--rx-live-ring); }
    .dark .rx-live-pill, .dark .rx-live-icon { color: var(--rx-live); }

    @keyframes pulse-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes drawer-in  { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes modal-in   { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: none; } }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(120,120,128,0.22); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(120,120,128,0.4); background-clip: content-box; border: 2px solid transparent; }
    .dark ::-webkit-scrollbar-thumb { background: rgba(180,180,200,0.18); background-clip: content-box; border: 2px solid transparent; }
    .dark ::-webkit-scrollbar-thumb:hover { background: rgba(180,180,200,0.3); background-clip: content-box; border: 2px solid transparent; }

    ::selection { background: rgba(24,24,27,0.12); }
    .dark ::selection { background: rgba(250,250,250,0.18); }
  </style>
</head>
<body class="bg-white dark:bg-zinc-950">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    window.useState = useState; window.useEffect = useEffect; window.useRef = useRef;
    window.useMemo = useMemo; window.useCallback = useCallback;
  </script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel">
    const Ic = window.Icons; window.Ic = Ic;
  </script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="pulse2-data.jsx"></script>
  <script type="text/babel" src="pulse2-shell.jsx"></script>
  <script type="text/babel" src="pulse2-views.jsx"></script>
  <script type="text/babel" src="pulse2-pages.jsx"></script>
  <script type="text/babel" src="pulse2-drawer.jsx"></script>
  <script type="text/babel" src="pulse2-app.jsx"></script>
</body>
</html>
